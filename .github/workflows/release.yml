name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x86_64
          - os: windows-latest
            target: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libunwind-dev is required on arm64 (Boehm GC links libunwind there)
          sudo apt-get install -y libgc-dev libunwind-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install bdw-gc llvm@21

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: 'C:\msys64'
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-llvm-libs
            mingw-w64-ucrt-x86_64-gc

      - name: Setup Windows Paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "LLVM_PATH=C:/msys64/ucrt64" >> $GITHUB_ENV
          echo "C:/msys64/ucrt64/bin" >> $GITHUB_PATH

      - name: Build eiwac
        # Baseline CPU: release binaries must run on any x86_64/arm64 (incl.
        # emulators like Rosetta 2, which lack AVX-512). `zig build` defaults to
        # `-mcpu=native`, baking the CI runner's host features into the binary.
        run: zig build -Dcpu=baseline

      - name: Build eiwa CLI
        # eiwac emits with the host CPU by default; force a portable binary for
        # the shipped CLI (see EIWA_BASELINE_CPU in the LLVM emitter).
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EIWA_BASELINE_CPU=1 ./bin/eiwac.exe build -o bin/eiwa.exe cli/src/main.ei
          else
            EIWA_BASELINE_CPU=1 ./bin/eiwac build -o bin/eiwa cli/src/main.ei
          fi

      - name: Package tarball & zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="eiwa-$VERSION-${{ matrix.target }}"
          STAGE="dist/$PKG"
          mkdir -p "$STAGE/bin"

          if [ "${{ runner.os }}" = "Windows" ]; then
            [ -f bin/eiwac.exe ] && cp bin/eiwac.exe "$STAGE/bin/" || cp bin/eiwac "$STAGE/bin/eiwac.exe"
            [ -f bin/eiwa.exe ] && cp bin/eiwa.exe "$STAGE/bin/" || cp bin/eiwa "$STAGE/bin/eiwa.exe"
            [ -f install.ps1 ] && cp install.ps1 "$STAGE/"
          else
            cp bin/eiwac bin/eiwa "$STAGE/bin/"
            [ -f install.sh ] && cp install.sh "$STAGE/"
          fi

          cp -R src "$STAGE/src"
          cp README.md "$STAGE/"

          # Produce tar.gz for all targets
          tar -czf "$PKG.tar.gz" -C dist "$PKG"
          sha256sum "$PKG.tar.gz" > "$PKG.tar.gz.sha256"

          # Produce .zip for Windows
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a -r "../$PKG.zip" "$PKG")
            sha256sum "$PKG.zip" > "$PKG.zip.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eiwa-${{ matrix.target }}
          path: |
            eiwa-*.tar.gz
            eiwa-*.zip
            eiwa-*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          find dist-assets -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp {} . \;
          cat eiwa-*.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --title "Eiwa $VERSION" \
            --generate-notes \
            eiwa-*.tar.gz eiwa-*.zip eiwa-*.sha256 SHA256SUMS

  docker:
    name: Build & Push Docker image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Pin to THIS release's tarball (not "latest", which could race) and
          # bust the Docker layer cache so the fresh release is downloaded.
          build-args: |
            EIWA_VERSION=${{ github.ref_name }}
            EIWA_CACHE_BUST=${{ github.sha }}
          tags: |
            eiwac/eiwa:${{ github.ref_name }}
            eiwac/eiwa:latest