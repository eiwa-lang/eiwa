name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libunwind-dev is required on arm64 (Boehm GC links libunwind there)
          sudo apt-get install -y libgc-dev libunwind-dev libcurl4-openssl-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install bdw-gc llvm@21

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: 'C:\msys64'
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-gc

      - name: Setup Windows Paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "LLVM_PATH=C:/msys64/ucrt64" >> $GITHUB_ENV
          echo "C:/msys64/ucrt64/bin" >> $GITHUB_PATH

      - name: Unit tests (zig build test)
        run: zig build test

      - name: Build eiwac
        run: zig build

      - name: Build eiwa CLI
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./bin/eiwac.exe build -o bin/eiwa.exe cli/src/main.ei
          else
            ./bin/eiwac build -o bin/eiwa cli/src/main.ei
          fi

      - name: Native test suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./bin/eiwac.exe test
          else
            ./bin/eiwac test
          fi

      - name: Smoke test (run sample)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./bin/eiwac.exe run samples/main.ei
          else
            ./bin/eiwac run samples/main.ei
          fi