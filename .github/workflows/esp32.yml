name: ESP32 firmware

# Proves the freestanding target end to end: eiwac emits the RV32 object on
# the host, then the real ESP-IDF toolchain links it and the size gate
# keeps the firmware inside the factory partition and DRAM budgets.
# Lessons encoded from bring-up: no ccache, and build in a container-local
# copy (bind mounts flake the parallel archiver on macOS/overlayfs).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: esp32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgc-dev
          wget -q https://apt.llvm.org/llvm.sh
          sudo chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Build eiwac
        run: zig build

      - name: Emit freestanding object
        run: ./bin/eiwac build --target esp32 -o samples/esp32-hello/main/eiwa_prog.o samples/esp32_wifi.ei

      - name: IDF link (espressif/idf:v5.5)
        run: |
          docker run --rm -e IDF_CCACHE_ENABLE=0 -v "$PWD":/work espressif/idf:v5.5 bash -c '
            rm -rf /tmp/eiwa && cp -r /work /tmp/eiwa &&
            cd /tmp/eiwa/samples/esp32-hello && rm -rf build sdkconfig &&
            idf.py --no-ccache build &&
            idf.py size --format json --output-file /tmp/fw-size.json &&
            cp /tmp/fw-size.json /work/samples/esp32-hello/size.json'

      - name: Size gate
        run: python3 scripts/esp32_size_gate.py samples/esp32-hello/size.json

      - name: Clean generated artifacts
        if: always()
        run: rm -f samples/esp32-hello/main/eiwa_prog.o samples/esp32-hello/size.json
